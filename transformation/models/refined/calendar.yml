models:
  - name: calendar
    description: >
      Calendar dimension. One row per calendar day, from the
      rates_start_date var up to and including today (UTC).
      Generated by dbt_utils.date_spine; no source.
    columns:
      - name: calendar_date
        description: Calendar day (grain of this model).
        data_tests:
          - unique
          - not_null
      - name: day_name
        description: Full weekday name in English (e.g. Monday).
      - name: iso_day_of_week
        description: ISO weekday number, Monday = 1 to Sunday = 7.
      - name: is_weekend
        description: True on Saturday and Sunday.
      - name: week_start
        description: Monday of the ISO week (i.e. truncated week).
      - name: iso_week
        description: ISO 8601 week number (1-53).
      - name: iso_year
        description: >
          ISO 8601 year the iso_week belongs to. Can differ from
          year in the first and last days of the calendar year.
      - name: month_start
        description: First day of the month (i.e. truncated month).
      - name: month_number
        description: Calendar month number (1-12).
      - name: month_name
        description: Full month name in English (e.g. January).
      - name: quarter_number
        description: Calendar quarter (1-4).
      - name: year_number
        description: Calendar year.