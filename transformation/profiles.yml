eur_exchange_rates:
  target: dev
  outputs:
    ci: &base
      type: bigquery
      method: oauth
      project: "{{ env_var('GCP_PROJECT_ID') }}"
      dataset: dev
      location: EU
      threads: 1
    dev: &impersonated
      <<: *base
      impersonate_service_account: "{{ env_var('DBT_SERVICE_ACCOUNT') }}"
    prod:
      <<: *impersonated
      dataset: prod