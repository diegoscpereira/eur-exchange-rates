eur_exchange_rates:
  target: dev
  outputs:
    dev:
      type: bigquery
      method: oauth
      project: "{{ env_var('GCP_PROJECT_ID') }}"
      dataset: dev
      location: EU
      threads: 1
      impersonate_service_account: "{{ env_var('DBT_SERVICE_ACCOUNT') }}"
    prod:
      type: bigquery
      method: oauth
      project: "{{ env_var('GCP_PROJECT_ID') }}"
      dataset: prod
      location: EU
      threads: 1
      impersonate_service_account: "{{ env_var('DBT_SERVICE_ACCOUNT') }}"
